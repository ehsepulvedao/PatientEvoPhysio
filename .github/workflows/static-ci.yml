name: Static research-software checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall scripts tests
      - name: Source audit
        run: python tests/static_audit.py
      - name: Generator configuration
        run: python tests/test_generator_config.py
      - name: Numeric baseline preservation
        run: python tests/compare_numeric_baseline.py
      - name: Publication pipeline helpers
        run: python tests/test_publication_pipeline.py
      - name: List scenarios and profiles
        run: python scripts/generate_csv.py --list
